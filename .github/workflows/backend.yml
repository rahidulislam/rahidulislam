name: Backend
on:
  push:
    branches: [dev, staging, main]
  pull_request:
    branches: [dev, staging, main]
permissions:
  contents: read
jobs:
  backend:
    name: Backend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate promotion path
        if: github.event_name == 'pull_request'
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import os
          base = os.environ['BASE_BRANCH']
          head = os.environ['HEAD_BRANCH']
          expected = {'main': 'staging', 'staging': 'dev'}.get(base)
          if expected and (head != expected or os.environ['HEAD_REPOSITORY'] != os.environ['BASE_REPOSITORY']):
              raise SystemExit(f'{base} accepts promotion PRs only from this repository’s {expected} branch')
          if base == 'dev' and head in {'main', 'staging'}:
              raise SystemExit('dev accepts isolated feature/fix branches, not release branches')
          PYCODE
      - run: python -m pip install -r requirements-dev.txt
      # SQLite is the production engine configured in settings.py.
      - run: python scripts/check_backend.py
        env:
          DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          DJANGO_EMAIL_BACKEND: django.core.mail.backends.locmem.EmailBackend
