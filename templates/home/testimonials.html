{% load portfolio_language %}{% if testimonials %}<section class="section container" aria-labelledby="testimonials-title"><p class="eyebrow">{{ 'Feedback shared with permission.'|translate:portfolio_language }}</p><h2 id="testimonials-title">{{ 'Testimonials'|translate:portfolio_language }}</h2><div class="article-grid">{% for testimonial in testimonials %}<figure class="article-card"><blockquote>{{ testimonial.review|linebreaks }}</blockquote><figcaption><strong>{{ testimonial.client_name }}</strong> · {{ testimonial.designation }}</figcaption></figure>{% endfor %}</div></section>{% endif %}
