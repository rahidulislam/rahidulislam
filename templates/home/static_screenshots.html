{% load portfolio_language %}{% load static %}
{% if static_screenshots %}<section aria-labelledby="screenshots-title"><h2 id="screenshots-title">{{ 'Project screenshots'|translate:portfolio_language }}</h2><p>{{ screenshots_description }}</p><div class="detail-gallery screenshot-gallery">{% for screenshot in static_screenshots %}<figure><a data-lightbox href="{% static screenshot.image %}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ screenshot.alt }} full size"><img src="{% static screenshot.image %}" alt="{{ screenshot.alt }}" width="{{ screenshot.width|default:1440 }}" height="{{ screenshot.height|default:1000 }}" loading="lazy"></a><figcaption>{{ screenshot.caption|translate:portfolio_language }}</figcaption></figure>{% endfor %}</div></section>{% endif %}
