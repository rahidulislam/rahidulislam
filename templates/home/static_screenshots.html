{% load static %}
{% if static_screenshots %}<section aria-labelledby="screenshots-title"><h2 id="screenshots-title">Project screenshots</h2><p>Captured from the live Ilmora frontend using its browser-local demo data.</p><div class="detail-gallery screenshot-gallery">{% for screenshot in static_screenshots %}<figure><a href="{% static screenshot.image %}" target="_blank" rel="noopener noreferrer" aria-label="Open {{ screenshot.alt }} full size"><img src="{% static screenshot.image %}" alt="{{ screenshot.alt }}" width="1440" height="1000" loading="lazy"></a><figcaption>{{ screenshot.caption }}</figcaption></figure>{% endfor %}</div></section>{% endif %}
