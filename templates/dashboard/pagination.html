{% if page.has_other_pages %}<nav class="pagination" aria-label="Pagination">{% if page.has_previous %}<a class="button" href="?page={{ page.previous_page_number }}&amp;q={{ query|urlencode }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}{% if parent %}&amp;{{ resource.parent }}={{ parent }}{% endif %}">← Previous</a>{% endif %}<span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>{% if page.has_next %}<a class="button" href="?page={{ page.next_page_number }}&amp;q={{ query|urlencode }}{% if status %}&amp;status={{ status|urlencode }}{% endif %}{% if parent %}&amp;{{ resource.parent }}={{ parent }}{% endif %}">Next →</a>{% endif %}</nav>{% endif %}
