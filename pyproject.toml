[tool.black]
line-length = 88
target-version = ["py312"]
force-exclude = '(/(venv|\.venv|staticfiles)/|/home/migrations/00(0[1-9]|[1-3][0-9]|4[0-3])_[^/]+\.py$)'

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["venv", ".venv", "staticfiles", "home/migrations/000[1-9]_*.py", "home/migrations/00[1-3][0-9]_*.py", "home/migrations/004[0-3]_*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "D3", "D4"]
